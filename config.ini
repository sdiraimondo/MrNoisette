[General]
DisableFrameDelay = 1

[Graphics]
Fullscreen = 0
WindowScale = 3
NewRenderer = 1
DisplayAspect = 4:3
NoSpriteLimits = 1

[Sound]
EnableAudio = 1
AudioFreq = 44100
AudioChannels = 2
AudioSamples = 512

# ── Keyboard mapping (one line per SNES button) ──
# KeyName = SDL scancode: A-Z, SPACE, RETURN, LSHIFT, UP, DOWN, LEFT, RIGHT, etc.
# The game uses SwapInputBits (reversed bits):
#   B=right, Y=left, A=jump, Select=crouch, R=pause, Start=menu
[Keyboard]
B = RIGHT
Y = LEFT
Left = Z
Right = A
X = S
A = X
Select = DOWN
Start = UP
Up = RETURN
Down = DOWN
R = C
L = D

# ── Gamepad mapping (one line per SNES button) ──
# BtnName = SDL gamepad button: DPAD_UP/DOWN/LEFT/RIGHT, A(=South),
# B(=East), X(=West), Y(=North), BACK, START, LEFTSHOULDER, RIGHTSHOULDER
[Gamepad]
A      = A
B      = DPAD_RIGHT
Y      = DPAD_LEFT
X      = X
L      = LEFTSHOULDER
R      = RIGHTSHOULDER
Select = DPAD_DOWN
Start  = DPAD_UP
Up     = START
Down   = BACK
Left   = Y
Right  = B
